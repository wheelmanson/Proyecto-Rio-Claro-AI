<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Río Claro | Asistente Inteligente</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>

  <div class="app">

    <header class="header">
      <div class="logo-section">
        <div class="logo">RC</div>
        <div class="company-info">
          <div class="company-name">Distribuidora Río Claro</div>
          <div class="company-subtitle">Plataforma Empresarial de IA</div>
        </div>
      </div>
    </header>

    <main class="main">

      <div class="assistant-card">
        
        <div class="card-top-bar">
          <div class="card-title-group">
            <h2 class="card-title">Río Claro - Asistente Inteligente</h2>
            <span class="status-badge"><span class="status-dot"></span> En línea</span>
          </div>
          <div class="card-actions">
            <button class="icon-btn">👤 ⌄</button>
            <button class="icon-btn">•••</button>
          </div>
        </div>

        <div class="card-body" id="messages" aria-live="polite">
          
          <h3 class="welcome-text">Bienvenido al Centro de Conocimiento Río Claro.</h3>
          <p class="instruction-text">Puede consultar información relacionada con:</p>
          
          <h4 class="section-title">Áreas de Consulta</h4>

          <div class="quick-actions">
            <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo se registra una factura?';">
              📄 Facturación
            </button>
            <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo se genera una orden de compra?';">
              🛒 Compras
            </button>
            <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo dar de alta un proveedor?';">
              🚚 Proveedores
            </button>
            <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo procesar una devolución?';">
              ↩️ Devoluciones
            </button>
            <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo atender una queja de cliente?';">
              🎧 Atención a Clientes
            </button>
          </div>

          <p class="footer-instruction"><em>Seleccione una opción o escriba una consulta personalizada.</em></p>

        </div>

      </div>

      <form id="chat-form" class="composer">
        <input 
          type="text" 
          id="message-input" 
          name="message" 
          maxlength="2000" 
          placeholder="Ejemplo: ¿Cómo se registra una factura?" 
          required 
          autocomplete="off">
        <button id="send-button" type="submit">
          Consultar 🚀
        </button>
      </form>

    </main>
  </div>

</body>
</html>
