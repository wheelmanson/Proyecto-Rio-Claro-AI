<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Río Claro | Asistente Inteligente</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>

  <div class="app">

    <!-- 1. EL LOGO VA AQUÍ AFUERA (Para que siempre esté visible y centrado en la página) -->
    <header class="header">
      <div class="logo-section">
        <img src="logo-rio-claro.jpg" alt="Logo Distribuidora Río Claro" class="main-logo">
      </div>
    </header>

    <main class="main">

      <div class="assistant-card">

               
        <!-- 3. ZONA DE MENSAJES -->
        <div class="messages" id="messages" aria-live="polite" aria-relevant="additions text">

          <article class="message assistant-message">
            <div class="message-body">
              <div class="message-author" style="display: none;">Río Claro - Asistente Inteligente</div>
              <div class="message-content">
                
                <p class="instruction-text">Puede consultar información relacionada con:</p>

                <div class="quick-actions">
                  
                  <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo se registra una factura?'; document.getElementById('chat-form').requestSubmit();">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Facturación
                  </button>

                  <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo se controla el inventario?'; document.getElementById('chat-form').requestSubmit();">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    Inventario
                  </button>

                  <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo se genera una orden de compra?'; document.getElementById('chat-form').requestSubmit();">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    Compras
                  </button>

                  <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo dar de alta un proveedor?'; document.getElementById('chat-form').requestSubmit();">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                    Proveedores
                  </button>

                  <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo procesar una devolución?'; document.getElementById('chat-form').requestSubmit();">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
                    Devoluciones
                  </button>

                  <button type="button" class="quick-btn" onclick="document.getElementById('message-input').value='¿Cómo atender una queja de cliente?'; document.getElementById('chat-form').requestSubmit();">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
                    Atención a Clientes
                  </button>

                </div>

                <p class="footer-instruction">Seleccione una opción o escriba una consulta personalizada.</p>
              </div>
            </div>
          </article>
        </div>

        <p id="typing-indicator" class="typing-indicator" hidden>
          Analizando información...
        </p>

      </div>

      <form id="chat-form" class="composer">
        <textarea
          id="message-input"
          name="message"
          maxlength="2000"
          rows="1"
          placeholder="Ejemplo: ¿Cómo se registra una factura?"
          required></textarea>

        <button id="send-button" type="submit">
          Consultar 
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 6px;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>

      <p id="form-error" class="form-error" hidden></p>

    </main>
  </div>

</body>
</html>
