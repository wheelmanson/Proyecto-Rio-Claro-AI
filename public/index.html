<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">

  <title>Río Claro | Asistente Inteligente</title>

  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>

<body>

  <div class="app">

    <header class="header">

      <div class="logo-section">

        <div class="logo">
          RC
        </div>

        <div>

          <div class="company-name">
            Distribuidora Río Claro
          </div>

          <div class="company-subtitle">
            Plataforma Empresarial de IA
          </div>

        </div>

      </div>

      <div class="status">

        <span class="status-dot"></span>

        <span>
          En línea
        </span>

      </div>

    </header>

    <main class="main">

      <div class="assistant-card">

        <div class="assistant-header">

          <div class="assistant-icon">
            IA
          </div>

          <div>

            <h1>
              Asistente Inteligente Río Claro
            </h1>

            <p>
              Consulta información operativa y administrativa de la organización.
            </p>

          </div>

        </div>

        <div
          class="messages"
          id="messages"
          aria-live="polite"
          aria-relevant="additions text">

          <article class="message assistant-message">

            <div class="message-avatar">
              RC
            </div>

            <div class="message-body">

              <div class="message-author">
                Río Claro · Asistente Inteligente
              </div>

              <div class="message-content">

                Bienvenido.

                <br><br>

                Escribe tu consulta para comenzar.

              </div>

            </div>

          </article>

        </div>

        <p
          id="typing-indicator"
          class="typing-indicator"
          hidden>

          Analizando información...

        </p>

      </div>

      <form
        id="chat-form"
        class="composer">

        <textarea
          id="message-input"
          name="message"
          maxlength="2000"
          rows="1"
          placeholder="Ejemplo: ¿Cómo se registra una factura?"
          required></textarea>

        <button
          id="send-button"
          type="submit">

          Consultar

        </button>

      </form>

      <p
        id="form-error"
        class="form-error"
        hidden>
      </p>

    </main>

  </div>

</body>
</html>
